const { useState, useEffect, useRef } = React;

function useIsMobile(breakpoint = 768) {
  const [isMobile, setIsMobile] = useState(window.innerWidth <= breakpoint);
  useEffect(() => {
    const handleResize = () => setIsMobile(window.innerWidth <= breakpoint);
    window.addEventListener("resize", handleResize);
    return () => window.removeEventListener("resize", handleResize);
  }, [breakpoint]);
  return isMobile;
}

function ArtemyxWordmark({ dark = false, size = "md" }) {
  const sizes = { sm: { main: 17, labs: 9, lsp: 2.5, llsp: 7 }, md: { main: 22, labs: 11, lsp: 2.5, llsp: 8 } };
  const s = sizes[size]; const tc = dark ? T.lightText : T.ink;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 1 }}>
      <div style={{ fontFamily: "'Orbitron', sans-serif", fontWeight: 700, fontSize: s.main, letterSpacing: s.lsp, textTransform: "uppercase", lineHeight: 1.1 }}>

      <div style={{ fontFamily: "'Orbitron', sans-serif", fontWeight: 700, fontSize: s.labs, letterSpacing: s.llsp, textTransform: "uppercase", background: T.gradient, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", opacity: 0.8 }}>LABS</div>
    </div>
  );
}

function Reveal({ children, delay = 0, style: extra = {} }) {
  const [vis, setVis] = useState(false); const ref = useRef(null);
  useEffect(() => { const o = new IntersectionObserver(([e]) => { if (e.isIntersecting) setVis(true); }, { threshold: 0.12 }); if (ref.current) o.observe(ref.current); return () => o.disconnect(); }, []);
  return <div ref={ref} style={{ opacity: vis ? 1 : 0, transform: vis ? "translateY(0)" : "translateY(28px)", transition: `all 0.7s cubic-bezier(0.16,1,0.3,1) ${delay}ms`, ...extra }}>{children}</div>;
}

function GradientButton({ children, href, onClick, variant = "solid", style: ex = {} }) {
  const base = { fontFamily: "'Orbitron', sans-serif", fontWeight: 600, fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", padding: "14px 32px", border: "none", cursor: "pointer", textDecoration: "none", display: "inline-block", transition: "all 0.25s ease" };
  const solid = { ...base, background: T.gradient, color: "#fff", borderRadius: 0, ...ex };
  const outline = { ...base, background: "transparent", color: T.midTeal, border: `1.5px solid ${T.midTeal}`, ...ex };
  const s = variant === "solid" ? solid : outline;
  const cn = variant === "solid" ? "gradient-btn" : "outline-btn";
  if (href) return <a href={href} style={s} className={cn}>{children}</a>;
  return <button onClick={onClick} style={s} className={cn}>{children}</button>;
}

function SectionLabel({ children }) {
  return <div style={{ fontFamily: "'Orbitron', sans-serif", fontWeight: 600, fontSize: 10, letterSpacing: 3, textTransform: "uppercase", background: T.gradient, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", marginBottom: 12 }}>{children}</div>;
}

function CaseStudyDetail({ study, onClose }) {

      <footer style={{ padding: isMobile ? "24px" : "28px 64px", borderTop: "1px solid rgba(226,232,240,0.06)", background: T.darkBg, display: "flex", flexDirection: isMobile ? "column" : "row", gap: isMobile ? 12 : 0, justifyContent: "space-between", alignItems: "center" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <ArtemyxIcon size={18} id="footerIcon" />
          <span style={{ fontFamily: "'Orbitron', sans-serif", fontWeight: 600, fontSize: 9, letterSpacing: 2, textTransform: "uppercase", color: "rgba(226,232,240,0.3)" }}>Artemyx Labs, LLC</span>
        </div>
        <span style={{ fontSize: 10, color: "rgba(226,232,240,0.2)" }}>© 2026 · Colorado</span>
      </footer>

      {activeStudy && <CaseStudyDetail study={activeStudy} onClose={() => setActiveStudy(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
